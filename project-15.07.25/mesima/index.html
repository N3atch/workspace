<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס ניהול חופשות</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/project-15.07.25/mesima/style.css">
</head>
<body dir="rtl">
    <div class="container">
        <h1 class="text-center my-4">טופס ניהול חופשות</h1>
        <form id="vacation-form" class="mx-auto" style="max-width: 500px;">
            <div class="form-group">
                <label for="name">שם החופשה / תיוג:</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="form-group">
                <label for="image-url">תמונה מהחופשה:</label>
                <input type="url" class="form-control" id="image-url" required>
            </div>
            <div class="form-group">
                <label for="price">מחיר החופשה:</label>
                <input type="number" class="form-control" id="price" min="0" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="rating">דירוג החופשה:</label>
                <select class="form-control" id="rating" required>
                    <option value="">-- בחרו דירוג --</option>
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="regular">Regular</option>
                    <option value="bad">Bad</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">שמור חופשה</button>
        </form>
        <div id="vacations-container" class="row mt-4"></div>
    </div>
    <script src="/project-15.07.25/mesima/script.js"></script>
</body>
</html>
