<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Task Board</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">
  <style>
    body {
      background-image: url('/project-15.07.25/projectfinish-24.07.25/Большая_картинка.jpeg.jpg'); /* Задний фон - доска */
      background-size: 100%;
      background-position: center;
      font-family: 'Shadows Into Light', cursive;
    }
    h1 {
      text-align: center;
      padding: 20px;
      font-size: 3rem;
      color: #000;
      text-shadow: 1px 1px 0 #fff;
    }
    #taskForm {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      background-image: url('/project-15.07.25/projectfinish-24.07.25/Маленькая_картинка_2.jpeg.jpg'); /* Фон формы — линованная бумага */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      padding: 20px 40px;
      border-radius: 10px;
      margin: 20px auto;
      max-width: 600px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }
    #taskForm input, #taskForm button {
      height: 40px;
    }
    .note {
      width: 200px;
      height: 200px;
      background-image: url('/project-15.07.25/projectfinish-24.07.25/Маленькая_картинка_3.jpeg.jpg'); /* Стикер */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      padding: 10px;
      margin: 10px;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
      position: relative;
      transition: all 0.5s ease-in-out;
      animation: fadeIn 0.6s ease-in;
      font-family: 'Shadows Into Light', cursive;
      font-size: 1.1rem;
      color: black;
    }
    .note:before {
      content: '';
      width: 15px;
      height: 15px;
      background: red; /* Кнопка-гвоздик */
      border-radius: 50%;
      position: absolute;
      top: -8px;
      left: calc(50% - 7.5px);
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .note .delete {
      position: absolute;
      top: 5px;
      right: 10px;
      color: white;
      background-color: black;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }
    .note .timestamp {
      position: absolute;
      bottom: 5px;
      right: 10px;
      font-size: 0.75rem;
      color: #444;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>My Task Board</h1>
  <div class="container">
    <!-- Форма добавления задачи -->
    <form id="taskForm">
      <input type="text" id="taskText" class="form-control" placeholder="Task description" required />
      <input type="date" id="taskDate" class="form-control" required />
      <input type="time" id="taskTime" class="form-control" required />
      <button type="submit" class="btn btn-primary">Add</button>
    </form>
    <!-- Доска с задачами -->
    <div id="taskBoard" class="d-flex flex-wrap justify-content-center"></div>
  </div>

  <script>
    const taskForm = document.getElementById('taskForm');
    const taskBoard = document.getElementById('taskBoard');

    // Загружаем задачи из localStorage при старте
    function loadTasks() {
      taskBoard.innerHTML = '';
      const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      tasks.forEach(addNoteToBoard);
    }

    // Сохраняем новую задачу в localStorage
    function saveTask(task) {
      const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      tasks.push(task);
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    // Удаление задачи
    function deleteTask(index) {
      let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
      tasks.splice(index, 1);
      localStorage.setItem('tasks', JSON.stringify(tasks));
      loadTasks();
    }

    // Добавляем стикер задачи на доску
    function addNoteToBoard(task, index) {
      const note = document.createElement('div');
      note.className = 'note';
      note.innerHTML = `
        <span class="delete" onclick="deleteTask(${index})">x</span>
        <p>${task.text}</p>
        <div class="timestamp">${task.date} ${task.time}</div>
      `;
      taskBoard.appendChild(note);
    }

    // Обработка отправки формы
    taskForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const text = document.getElementById('taskText').value.trim();
      const date = document.getElementById('taskDate').value;
      const time = document.getElementById('taskTime').value;

      if (!text || !date || !time) return;

      const task = { text, date, time };
      saveTask(task);
      loadTasks();
      taskForm.reset();
    });

    // Загружаем задачи при открытии страницы
    window.onload = loadTasks;
  </script>
</body>
</html>
