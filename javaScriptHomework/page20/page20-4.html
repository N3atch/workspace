<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>מחרוזת</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            direction: rtl;
        }
        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="container">
    <label for="year">קלט שנה:</label><br>
    <input type="number" id="year"><br><br>
    
    <button onclick="checkLeapYear()">בדוק</button>
    <div id="result"></div>
</div>

<script>
    function checkLeapYear() {
        const year = document.getElementById('year').valueAsNumber;
        
        if (!isNaN(year)) {
            let isLeapYear;
            
            if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
                isLeapYear = true;
            } else {
                isLeapYear = false;
            }
            
            document.getElementById('result').innerText = `${year} היא ${isLeapYear ? 'שנה מעוברת' : 'שנה רגילה'}`;
        } else {
            document.getElementById('result').innerText = 'נא להזין שנה חוקית.';
        }
    }
</script>

</body>
</html>
