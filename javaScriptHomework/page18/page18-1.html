<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>מחרוזת</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            direction: rtl;
        }
        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="container">
    <label for="num">קלט ערך:</label><br>
    <input type="number" id="num"><br><br>
    
    <button onclick="classifyValue()">סווג</button>
    <div id="result"></div>
</div>

<script>
    function classifyValue() {
        const value = document.getElementById('num').valueAsNumber;
        
        if (!isNaN(value)) {
            switch(true) {
                case (value < 0):
                    document.getElementById('result').innerText = 'Negative';
                    break;
                case (value === 0):
                    document.getElementById('result').innerText = 'Zero';
                    break;
                default:
                    document.getElementById('result').innerText = 'Positive';
            }
        } else {
            document.getElementById('result').innerText = 'נא להזין ערך חוקי.';
        }
    }
</script>

</body>
</html>
