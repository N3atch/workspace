<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספרה ימנית ביותר</title>
    <style>
        body {
            direction: rtl;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding-top: 50px;
        }
        label {
            display: inline-block;
            width: 100px;
            text-align: right;
        }
        input[type="number"] {
            width: 100px;
            padding: 5px;
            margin-left: 10px;
        }
        button {
            margin-top: 10px;
        }
        p {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ספרה ימנית ביותר</h1>
        <label for="number">מספר (לפחות 4 ספרות):</label>
        <input type="number" id="number" placeholder="1000–9999" value="1234"><br><br>
        <button onclick="findRightmostDigit()">חשב</button>
        <p id="result"></p>
    </div>

</body>
</html>
<script>
// קבלת השדה המתאים על פי ה-ID
const numberInput = document.getElementById('number');
const resultOutput = document.getElementById('result');

// פונקציה עיקרית לחישוב הספרה הימנית ביותר
function findRightmostDigit() {
    // המרת הערך למספר
    const number = parseInt(numberInput.value);

    if (!isNaN(number) && String(number).length >= 4) { // בדיקת תקינות הערך ואם הוא בן 4 ספרות לפחות
        const lastDigit = number % 10;                  // חישוב הספרה הימנית ביותר
        
        // פורמט הצגת התוצאה
        resultOutput.textContent = `הספרה הימנית ביותר היא: ${lastDigit}`;
    } else {
        alert("אנא הכנס מספר בן 4 ספרות לפחות!");
    }
}
</script>
