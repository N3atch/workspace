<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפיכת סדר ספרות</title>
    <style>
        body {
            direction: rtl;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding-top: 50px;
        }
        label {
            display: inline-block;
            width: 100px;
            text-align: right;
        }
        input[type="number"] {
            width: 100px;
            padding: 5px;
            margin-left: 10px;
        }
        button {
            margin-top: 10px;
        }
        p {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>הפיכת סדר ספרות</h1>
        <label for="number">מספר בין 10 ל-99:</label>
        <input type="number" id="number" placeholder="10–99" value="61"><br><br>
        <button onclick="reverseNumber()">הפוך</button>
        <p id="result"></p>
    </div>

<script>
// קבלת השדה המתאים על פי ה-ID
const numberInput = document.getElementById('number');
const resultOutput = document.getElementById('result');

// פונקציה עיקרית להפיכת סדר הספרות
function reverseNumber() {
    // המרת הערך למספר
    const number = parseInt(numberInput.value);

    if (!isNaN(number) && number >= 10 && number <= 99) { // בדיקת תקינות הערך
        const reversedNumber = ((number % 10) * 10) + Math.floor(number / 10); // הפיכת סדר הספרות
        
        // פורמט הצגת התוצאה
        resultOutput.textContent = `המספר החדש הוא: ${reversedNumber}`;
    } else {
        alert("אנא הכנס מספר בין 10 ל-99!");
    }
}
</script>
</body>
</html>
