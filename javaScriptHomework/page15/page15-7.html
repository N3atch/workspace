<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספרת המאות</title>
    <style>
        body {
            direction: rtl;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding-top: 50px;
        }
        label {
            display: inline-block;
            width: 100px;
            text-align: right;
        }
        input[type="number"] {
            width: 100px;
            padding: 5px;
            margin-left: 10px;
        }
        button {
            margin-top: 10px;
        }
        p {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ספרת המאות</h1>
        <label for="number">מספר תלת־ספרתי:</label>
        <input type="number" id="number" placeholder="100–999" value="123"><br><br>
        <button onclick="extractHundredsDigit()">חשב</button>
        <p id="result"></p>
    </div>

<script>
// קבלת השדה המתאים על פי ה-ID
const numberInput = document.getElementById('number');
const resultOutput = document.getElementById('result');

// פונקציה עיקרית לחישוב ספרת המאות
function extractHundredsDigit() {
    // המרת הערך למספר
    const number = parseInt(numberInput.value);

    if (!isNaN(number) && String(number).length === 3) { // בדיקת תקינות הערך ואם הוא בן 3 ספרות
        const hundredsDigit = Math.floor(number / 100); // חישוב ספרת המאות
        
        // פורמט הצגת התוצאה
        resultOutput.textContent = `ספרת המאות היא: ${hundredsDigit}`;
    } else {
        alert("אנא הכנס מספר תלת־ספרתי תקין!");
    }
}
</script>
</body>
</html>
