<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שטח והיקף של חדר מלבני</title>
    <style>
        body {
            direction: rtl;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding-top: 50px;
        }
        label {
            display: inline-block;
            width: 100px;
            text-align: right;
        }
        input[type="number"] {
            width: 100px;
            padding: 5px;
            margin-left: 10px;
        }
        button {
            margin-top: 10px;
        }
        p {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>שטח והיקף של חדר מלבני</h1>
        <label for="length">אורך החדר (מטרים)</label>
        <input type="number" id="length"><br><br>
        <label for="width">רוחב החדר (מטרים)</label>
        <input type="number" id="width"><br><br>
        <button onclick="calculateAreaAndPerimeter()">חשב</button>
        <p id="result"></p>
    </div>

<script>
// ID - קבלת השדות המתאימים על פי ה
const lengthInput = document.getElementById('length');
const widthInput = document.getElementById('width');
const resultOutput = document.getElementById('result');

// פונקציה עיקרית לחישוב השטח והיקף
function calculateAreaAndPerimeter() {
    // המרת הערכים למספרים
    const length = parseFloat(lengthInput.value);
    const width = parseFloat(widthInput.value);

    if (!isNaN(length) && !isNaN(width)) { // בדיקת תקינות הערכים
        const area = length * width;                 // חישוב השטח
        const perimeter = 2 * (length + width);     // חישוב היקף
        
        // פורמט הצגת התוצאה
        resultOutput.textContent = `שטח החדר: ${area} מ"ר\nהיקף החדר: ${perimeter} מטרים`;
    } else {
        alert("אנא הכנס ערכים מספריים תקינים");
    }
}
</script>
</body>
</html>
