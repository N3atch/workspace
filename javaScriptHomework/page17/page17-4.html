<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>מחרוזת</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            direction: rtl;
        }
        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="container">
    <label for="num1">ערך ראשון:</label><br>
    <input type="number" id="num1"><br><br>
    
    <label for="num2">ערך שני:</label><br>
    <input type="number" id="num2"><br><br>
    
    <button onclick="checkDivisibility()">בדוק</button>
    <div id="result"></div>
</div>

<script>
    function checkDivisibility() {
        const num1 = document.getElementById('num1').valueAsNumber;
        const num2 = document.getElementById('num2').valueAsNumber;
        
        let result = "";
        
        if (!isNaN(num1) && !isNaN(num2)) {
            if (num1 !== 0 && num2 !== 0) {
                if (num1 % num2 === 0) {
                    result += `${num1} מתחלק ב-${num2}<br>`;
                } else {
                    result += `${num1} אינו מתחלק ב-${num2}<br>`;
                }
                
                if (num2 % num1 === 0) {
                    result += `${num2} מתחלק ב-${num1}`;
                } else {
                    result += `${num2} אינו מתחלק ב-${num1}`;
                }
            } else {
                result = 'אחד המספרים הוא אפס. לא ניתן לבצע חלוקה באפס.';
            }
        } else {
            result = 'נא להזין מספרים חוקיים.';
        }
        
        document.getElementById('result').innerHTML = result;
    }
</script>

</body>
</html>
