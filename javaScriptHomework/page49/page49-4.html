<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מטריצה של מדדים חודשיים ושנתיים</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>מטריצה של מדדים חודשיים ושנתיים</h1>
    <table id="metricsTable"></table>

    <script>
        // יצירת מטריצה בגודל 10x13 עם מספרים קבועים
        const metrics = [
            [12, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 0], // שנה 1
            [10, 14, 18, 22, 26, 30, 34, 38, 42, 46, 50, 54, 0], // שנה 2
            [11, 16, 21, 26, 31, 36, 41, 46, 51, 56, 61, 66, 0], // שנה 3
            [13, 17, 23, 29, 33, 37, 43, 47, 53, 57, 63, 67, 0], // שנה 4
            [14, 19, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60, 0], // שנה 5
            [15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 0], // שנה 6
            [16, 21, 26, 31, 36, 41, 46, 51, 56, 61, 66, 71, 0], // שנה 7
            [17, 22, 27, 32, 37, 42, 47, 52, 57, 62, 67, 72, 0], // שנה 8
            [18, 23, 28, 33, 38, 43, 48, 53, 58, 63, 68, 73, 0], // שנה 9
            [19, 24, 29, 34, 39, 44, 49, 54, 59, 64, 69, 74, 0] // שנה 10
        ];

        // אפס את כל התאים המתחלקים ב-5 או ב-7
        for (let i = 0; i < metrics.length; i++) {
            for (let j = 0; j < metrics[i].length; j++) {
                if (metrics[i][j] % 5 === 0 || metrics[i][j] % 7 === 0) {
                    metrics[i][j] = 0; // אפס את התא
                }
            }
        }

        // הצגת המטריצה בטבלה
        const table = document.getElementById('metricsTable');
        
        for (let i = 0; i < metrics.length; i++) {
            const row = document.createElement('tr');
            for (let j = 0; j < metrics[i].length; j++) {
                const cell = document.createElement('td');
                cell.textContent = metrics[i][j];
                row.appendChild(cell);
            }
            table.appendChild(row);
        }
    </script>
</body>
</html>
