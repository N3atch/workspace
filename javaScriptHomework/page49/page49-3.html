<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מטריצה של מדדים חודשיים ושנתיים</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>מטריצה של מדדים חודשיים ושנתיים</h1>
    <table id="metricsTable"></table>
    <p id="maxRow"></p>

    <script>
        // יצירת מטריצה בגודל 10x13 עם מספרים אקראיים
        const metrics = [];
        
        for (let i = 0; i < 10; i++) {
            const yearMetrics = new Array(13);
            for (let j = 0; j < 12; j++) {
                // ממלא את המדדים החודשיים במספרים אקראיים בין 0 ל-100
                yearMetrics[j] = Math.floor(Math.random() * 101);
            }
            // ממלא את המדד השנתי כסכום המדדים החודשיים
            yearMetrics[12] = yearMetrics.slice(0, 12).reduce((a, b) => a + b, 0);
            metrics.push(yearMetrics);
        }

        // הצגת המטריצה בטבלה
        const table = document.getElementById('metricsTable');
        
        for (let i = 0; i < metrics.length; i++) {
            const row = document.createElement('tr');
            for (let j = 0; j < metrics[i].length; j++) {
                const cell = document.createElement('td');
                cell.textContent = metrics[i][j];
                row.appendChild(cell);
            }
            table.appendChild(row);
        }

        // חישוב השורה עם הסכום הגבוה ביותר
        let maxSum = -1;
        let maxRowIndex = -1;

        for (let i = 0; i < metrics.length; i++) {
            const rowSum = metrics[i].reduce((a, b) => a + b, 0);
            if (rowSum > maxSum) {
                maxSum = rowSum;
                maxRowIndex = i;
            }
        }

        // הדפסת מספר השורה עם הסכום הגבוה ביותר
        document.getElementById('maxRow').textContent = מספר השורה עם הסכום הגבוה ביותר הוא: ${maxRowIndex + 1};
    </script>
</body>
</html>
